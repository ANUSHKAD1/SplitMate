services:
  postgres:
    image: postgres:18.6
    container_name: splitmate-postgres
    environment:
      POSTGRES_DB: splitmate
      POSTGRES_USER: splitmate_user
      POSTGRES_PASSWORD: splitmate_dev_password
    ports:
      - "5432:5432"
    volumes:
      - splitmate_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitmate_user -d splitmate"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  splitmate_postgres_data:
    name: splitmate_postgres_data
